# The one secret the release workflow reads (spec 0006). Declared by name only: no value is stored in the repository.
# It lives as the environment secret NPM_TOKEN of the GitHub environment `npm-release` of phibkro/pg-outbox. Remove it with
# the token, see the spec's removal checklist.
[project]
name = "pg-outbox"
revision = "1.0"

[profiles.default]
NPM_TOKEN = { description = "Granular npm access token (read and write, org pg-outbox, expires) used by .github/workflows/release.yml to publish", required = true }
